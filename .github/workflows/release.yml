name: Release

# Publishes to npm when a version tag (e.g. v0.2.0) is pushed.
#
# Security model:
#   - Runs only on `v*` tags, never on branch pushes or PRs.
#   - Re-runs the full quality gate (lint, format, test, build) before publish.
#   - Verifies the tag matches package.json so a stray tag can't ship a
#     mismatched version.
#   - Uses a least-privilege GITHUB_TOKEN (contents: read) plus id-token: write
#     for npm provenance (signed supply-chain attestation).
#   - Publish runs in a protected `release` environment, so you can require a
#     manual approval and scope the NPM_TOKEN secret to that environment.
#   - The npm token is only exposed to the single publish step via env.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Only publish for real version tags (not manual dispatch on a branch).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      url: https://www.npmjs.com/package/notion-rsync
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build explicitly so the published artifact is produced by this job.
      # (prepublishOnly also runs `bun run build`; bun is on PATH here.)
      - name: Build bundle
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
