name: Release

# Publishes to npm when a version bump lands on main (merge a PR that changes
# the version in package.json), on a version tag (e.g. v0.2.0), or a manual run.
#
# Auth: npm Trusted Publishing (OIDC) — https://docs.npmjs.com/trusted-publishers
#   No NPM_TOKEN. GitHub Actions mints a short-lived OIDC credential that npm
#   trusts, so there's no long-lived secret to manage and publishes are exempt
#   from 2FA/OTP. Provenance is generated automatically.
#
#   One-time npm setup: on npmjs.com → the `notion-rsync` package → Settings →
#   "Trusted Publisher" → GitHub Actions, with:
#     Repository: nonfx/notion-sync
#     Workflow:   .github/workflows/release.yml
#     Environment: release   (must match the `environment:` on the publish job)
#
# Security model:
#   - Re-runs the full quality gate (lint, format, test, build) before publish.
#   - Verifies the tag matches package.json so a stray tag can't ship a
#     mismatched version.
#   - Least-privilege GITHUB_TOKEN (contents: read); id-token: write only on the
#     publish job (required for OIDC + provenance).
#   - Publish runs in a protected `release` environment for optional approval.

on:
  push:
    branches: [main]
    paths: ["package.json"] # version bumps; non-bump changes are skipped by the already-published check
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "git tag:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # Publish on a push to main (version bump merged), a version tag, or a
    # manual run (workflow_dispatch) — the latter publishes whatever version is
    # in package.json on the selected ref.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
    environment:
      name: release
      url: https://www.npmjs.com/package/notion-rsync
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node + npm registry
        uses: actions/setup-node@v4
        with:
          # Trusted Publishing requires Node >= 22.14 (publish job only — the
          # published package itself still supports older Node runtimes).
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older npm.
      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build explicitly so the published artifact is produced by this job.
      # (prepublishOnly also runs `bun run build`; bun is on PATH here.)
      - name: Build bundle
        run: bun run build

      # Skip if this version is already on npm, so re-runs don't fail with
      # EVERSION (e.g. after fixing a transient publish error).
      - name: Check if already published
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>/tmp/npm_view.err; then
            echo "$NAME@$VERSION is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif grep -q "E404" /tmp/npm_view.err; then
            # Genuinely not published yet — proceed.
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            # Auth/network/other error — fail closed rather than risk a bad publish.
            echo "::error::npm view failed unexpectedly:"
            cat /tmp/npm_view.err
            exit 1
          fi

      # No NODE_AUTH_TOKEN: auth comes from the OIDC trusted publisher.
      # Provenance is generated automatically for OIDC publishes.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: npm publish --access public
